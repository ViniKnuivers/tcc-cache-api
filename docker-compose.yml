# Serviços do experimento. Versões fixadas para reprodutibilidade.
# Portas no host escolhidas para não colidir com outros serviços locais:
#   Postgres 5434 · Redis 6380 · API 3000 · nginx 8080 (ponto de entrada da carga)
name: tcc-cache

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: tcc-cache-pg
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      # Estatísticas de consultas (contagem de acessos ao banco por execução).
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.11-alpine
    container_name: tcc-cache-redis
    # Redis como cache puro: sem persistência em disco, com limite de memória
    # e descarte LRU quando cheio.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6380:6379"
    cpus: 1
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: tcc-cache-api:local
    container_name: tcc-cache-api
    environment:
      DATABASE_URL: postgresql://catalogo:catalogo@postgres:5432/catalogo
      REDIS_URL: redis://redis:6379
      # Definidos pelo runner do experimento a cada configuração.
      CACHE_STRATEGY: ${CACHE_STRATEGY:-none}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      MEMORY_CACHE_MAX_ENTRIES: ${MEMORY_CACHE_MAX_ENTRIES:-10000}
      PORT: "3000"
      LOG_LEVEL: warn
    ports:
      - "3000:3000"
    # Recursos fixos da API: a comparação entre estratégias precisa que a
    # aplicação tenha sempre a mesma capacidade de CPU e memória.
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:1.28.3-alpine
    container_name: tcc-cache-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Cache do nginx em memória (tmpfs): sem disco no caminho e zerado a cada
    # reinício do contêiner (o runner reinicia entre execuções).
    tmpfs:
      - /var/cache/nginx:size=128m
    ports:
      - "8080:8080"
    cpus: 1
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
