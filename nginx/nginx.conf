# nginx à frente da API, no caminho de TODAS as estratégias (mesma topologia
# de rede para todas). Ele só armazena respostas que a API marca como
# cacheáveis (Cache-Control: public, max-age) — ou seja, só na estratégia
# "http". Nas demais a API responde "no-store" e o nginx apenas repassa.

worker_processes 1;
events { worker_connections 4096; }

http {
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  keepalive_requests 100000;

  # Cache compartilhado (intermediário), em tmpfs (ver docker-compose.yml).
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=100m inactive=10m use_temp_path=off;

  upstream api_upstream {
    server api:3000;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_cache api;
      proxy_cache_methods GET HEAD;
      proxy_cache_key $request_uri;
      # Respeita Cache-Control/ETag da API; ao expirar, revalida com
      # requisição condicional (If-None-Match) em vez de baixar tudo de novo.
      proxy_cache_revalidate on;
      # Várias requisições simultâneas pelo mesmo item ausente geram só uma
      # ida à API (evita "estouro" de misses simultâneos).
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;

      # Diagnóstico: HIT, MISS, EXPIRED, REVALIDATED... (lido pelo k6).
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
